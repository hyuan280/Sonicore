server {
    listen 2880;

    root /usr/share/nginx/html;

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /ws {
        proxy_pass http://sonicore:4530;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://sonicore:4530;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/ {
        proxy_pass http://sonicore:4530;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Port for reverse-proxy chains (FRP / host nginx with proxy_protocol).
# The upstream proxy decodes the real client IP from proxy_protocol and
# sets X-Real-IP / X-Forwarded-For before forwarding here — those headers
# are passed through (not overwritten with $remote_addr) to preserve the
# real client IP through the chain.
server {
    listen 28880;

    root /usr/share/nginx/html;

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /ws {
        proxy_pass http://sonicore:4530;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://sonicore:4530;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /rest/ {
        proxy_pass http://sonicore:4530;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
