<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family:sans-serif;padding:20px;color:#333">
<h2>Scan Complete</h2>
<p>Library <strong>{{.LibraryName}}</strong> has been scanned.</p>
<table style="border-collapse:collapse;margin:16px 0">
<tr><td style="padding:4px 12px;border:1px solid #ddd">New tracks</td><td style="padding:4px 12px;border:1px solid #ddd">{{.NewTracks}}</td></tr>
<tr><td style="padding:4px 12px;border:1px solid #ddd">Updated</td><td style="padding:4px 12px;border:1px solid #ddd">{{.UpdatedTracks}}</td></tr>
<tr><td style="padding:4px 12px;border:1px solid #ddd">Deleted</td><td style="padding:4px 12px;border:1px solid #ddd">{{.DeletedTracks}}</td></tr>
<tr><td style="padding:4px 12px;border:1px solid #ddd">Errors</td><td style="padding:4px 12px;border:1px solid #ddd;white-space:pre-wrap">{{.Errors}}</td></tr>
</table>
<p style="color:#888;font-size:12px">{{.Timestamp}}</p>
</body>
</html>
