# Sonicore 配置文件模板
# 复制为 config.toml 后修改：
#   cp config.example.toml config.toml
#
# Docker 部署请使用环境变量（见 deploy/.env.example），不需要此文件。

[server]
host = "0.0.0.0"
port = 4530
# 对外访问地址，用于生成流媒体 URL
base_url = "http://localhost:4530"
# 前端静态文件目录（开发时通常为 web/dist）
# web_dir = "web/dist"
# 可信代理 CIDR 列表，仅当对端 IP（RemoteAddr）匹配列表中任一网段时，才信任 X-Real-IP / X-Forwarded-For 请求头
# trusted_proxies = ["172.17.0.0/16"]

[database]
host = "localhost"
port = 5432
user = "sonicore"
password = "change-me"
dbname = "sonicore"
sslmode = "disable"

[redis]
host = "localhost"
port = 6379
password = ""
db = 0
key_prefix = "sonicore:"

[data]
# 音乐库根目录（扫描此目录下的音频文件）
music_dir = "/opt/sonicore/music"
# 应用数据目录（封面缓存等）
data_dir = "/opt/sonicore/data"
images_dir = "/opt/sonicore/data/images"
cache_dir = "/opt/sonicore/data/cache"
# 歌词文件存储目录
lyrics_dir = "/opt/sonicore/data/lyrics"

[jwt]
# 重要：必须替换为随机密钥（openssl rand -hex 32），长度 >= 32 字节。
# 该占位符为公开已知值，secrets.New 会直接拒绝服务启动；同时它经 HKDF
# 派生为 server_settings 中平台凭据（如网易云 Cookie）的落库加密密钥；
# 更换密钥后已加密的 Cookie 无法解密，需在管理后台重新填写。
secret = "change-me-in-production-0123456789abcdef0123456789"
# 访问令牌过期时间
expiration = "24h"
# 刷新令牌过期时间（30 天）
refresh_expiration = "720h"

[audio]
# PulseAudio 服务器路径。不配置此值则不使用 PulseAudio（仅保留 ALSA 检测）。
# pulse_server = "/run/pulse/native"

[metadata]
# MusicBrainz 元数据刮削。默认关闭，需手动启用。
# musicbrainz_enabled = false
# musicbrainz_api_url = "https://musicbrainz.org/ws/2"
# musicbrainz_rate_limit = 1

# 网易云音乐元数据识别（MusicBrainz 无结果时的兜底源）。
# 开启后网易云平台同步启用（provider 始终构建，匿名可用）。
# 识别结果以 metadata_source=netease 落库。
# netease_enabled = false

[platforms]
# 外部音乐平台（榜单/搜索/详情）。当前仅支持网易云音乐。
# 两种启用方式：在 enabled 中列出，或设置对应平台的 enabled = true
# enabled = ["netease"]

[platforms.netease]
enabled = false
# 可选：登录后导出的 Cookie（含 MUSIC_U/MUSIC_A）。留空则使用匿名访问。
# cookie = ""
# 出站请求限速（每秒请求数）。扫描会高频请求，网易云服务端会按频率限流
# （code 405 操作频繁）；默认 1 较保守，可依账号实际耐受度调高，0 关闭限速。
# rate_limit = 1

[log]
level = "info"
format = "console"
