# Sonicore 配置文件模板
# 复制为 config.toml 后修改：
#   cp config.example.toml config.toml
#
# Docker 部署请使用环境变量（见 deploy/.env.example），不需要此文件。

[server]
host = "0.0.0.0"
port = 4530
# 对外访问地址，用于生成流媒体 URL
base_url = "http://localhost:4530"
# 前端静态文件目录（开发时通常为 web/dist）
# web_dir = "web/dist"

[database]
host = "localhost"
port = 5432
user = "sonicore"
password = "change-me"
dbname = "sonicore"
sslmode = "disable"

[redis]
host = "localhost"
port = 6379
password = ""
db = 0
key_prefix = "sonicore:"

[data]
# 音乐库根目录（扫描此目录下的音频文件）
music_dir = "/opt/sonicore/music"
# 应用数据目录（封面缓存等）
data_dir = "/opt/sonicore/data"
images_dir = "/opt/sonicore/data/images"
cache_dir = "/opt/sonicore/data/cache"
# 歌词文件存储目录
lyrics_dir = "/opt/sonicore/data/lyrics"

[jwt]
# 重要：部署时请用 openssl rand -hex 32 生成新密钥
secret = "change-me-in-production"
# 访问令牌过期时间
expiration = "24h"
# 刷新令牌过期时间（30 天）
refresh_expiration = "720h"

[audio]
# PulseAudio 服务器路径。不配置此值则不使用 PulseAudio（仅保留 ALSA 检测）。
# pulse_server = "/run/pulse/native"

[metadata]
# MusicBrainz 元数据刮削。默认关闭，需手动启用。
# musicbrainz_enabled = false
# musicbrainz_api_url = "https://musicbrainz.org/ws/2"
# musicbrainz_rate_limit = 1

[log]
level = "info"
format = "console"
